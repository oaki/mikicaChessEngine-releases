name: Publish binary release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish or repair"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify staged release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="releases/${RELEASE_TAG}"
          test -f "${RELEASE_DIR}/RELEASE-NOTES.md"
          test -f "${RELEASE_DIR}/SHA256SUMS.txt"
          test "$(find "${RELEASE_DIR}" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 4
          (cd "${RELEASE_DIR}" && sha256sum --check SHA256SUMS.txt)
      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="releases/${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "${RELEASE_DIR}"/*.tar.gz \
              "${RELEASE_DIR}"/*.zip \
              "${RELEASE_DIR}/SHA256SUMS.txt" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --latest \
              --title "mikicaChessEngine ${RELEASE_TAG}" \
              --notes-file "${RELEASE_DIR}/RELEASE-NOTES.md"
          else
            gh release create "${RELEASE_TAG}" \
              "${RELEASE_DIR}"/*.tar.gz \
              "${RELEASE_DIR}"/*.zip \
              "${RELEASE_DIR}/SHA256SUMS.txt" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --latest \
              --title "mikicaChessEngine ${RELEASE_TAG}" \
              --notes-file "${RELEASE_DIR}/RELEASE-NOTES.md"
          fi
